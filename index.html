<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seda2026 - Видеозвонки</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    color: white;
  }
  .app { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .header { text-align: center; padding: 20px; margin-bottom: 20px; }
  .header h1 {
    font-size: 3em;
    background: linear-gradient(45deg, #00d4ff, #ff00ea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .lobby {
    max-width: 500px;
    margin: 30px auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .my-id {
    background: rgba(0,0,0,0.3);
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
    word-break: break-all;
    font-family: monospace;
    font-size: 16px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .my-id strong { color: #00d4ff; flex: 1; text-align: center; }
  input {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    margin: 10px 0;
    background: rgba(255,255,255,0.2);
    color: white;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.6); }
  button {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00d4ff, #0099cc);
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
    margin: 5px 0;
  }
  button:hover:not(:disabled) { transform: scale(1.02); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .copy-btn {
    background: linear-gradient(45deg, #764ba2, #667eea);
    padding: 8px 15px;
    font-size: 14px;
    width: auto;
    margin: 0;
  }
  .retry-btn {
    background: linear-gradient(45deg, #f39c12, #e67e22);
    margin-top: 10px;
  }
  .videos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }
  .video-container {
    position: relative;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    aspect-ratio: 16/9;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  .video-label {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 14px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    background: rgba(0,0,0,0.3);
    border-radius: 20px;
    flex-wrap: wrap;
  }
  .control-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    padding: 0;
    margin: 0;
  }
  .control-btn.off { background: linear-gradient(45deg, #e74c3c, #c0392b); }
  .control-btn.end { background: linear-gradient(45deg, #e74c3c, #c0392b); }
  .control-btn.screen { background: linear-gradient(45deg, #27ae60, #229954); }
  .control-btn.screen.active { background: linear-gradient(45deg, #f39c12, #e67e22); }
  .status {
    text-align: center;
    padding: 10px;
    margin: 10px 0;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    font-weight: bold;
  }
  .status.connected { background: rgba(46, 204, 113, 0.3); }
  .status.connecting { background: rgba(241, 196, 15, 0.3); }
  .status.error { background: rgba(231, 76, 60, 0.3); }
  .error {
    background: rgba(231, 76, 60, 0.3);
    padding: 15px;
    border-radius: 10px;
    margin: 10px 0;
    border-left: 4px solid #e74c3c;
  }
  .info {
    background: rgba(52, 152, 219, 0.2);
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.6;
  }
  .server-info {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    margin-top: 10px;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// Список PeerJS серверов для fallback
const PEER_SERVERS = [
  { host: '0.peerjs.com', port: 443, path: '/', secure: true },
  { /* default cloud */ },
  { host: 'peerjs-server.herokuapp.com', port: 443, path: '/', secure: true }
];

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun3.l.google.com:19302' },
  { urls: 'stun:stun4.l.google.com:19302' },
  { urls: 'stun:global.stun.twilio.com:3478' },
  // Бесплатный TURN сервер (OpenRelay)
  {
    urls: 'turn:openrelay.metered.ca:80',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  },
  {
    urls: 'turn:openrelay.metered.ca:443',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  },
  {
    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  }
];

function generateShortId() {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let id = 'seda-';
  for (let i = 0; i < 6; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

function App() {
  const [myId, setMyId] = useState('');
  const [remoteId, setRemoteId] = useState('');
  const [inCall, setInCall] = useState(false);
  const [status, setStatus] = useState('connecting');
  const [statusText, setStatusText] = useState('Подключение к серверу...');
  const [error, setError] = useState('');
  const [micOn, setMicOn] = useState(true);
  const [camOn, setCamOn] = useState(true);
  const [screenSharing, setScreenSharing] = useState(false);
  const [copied, setCopied] = useState(false);
  const [serverAttempt, setServerAttempt] = useState(0);

  const peerRef = useRef(null);
  const localStreamRef = useRef(null);
  const cameraStreamRef = useRef(null);
  const currentCallRef = useRef(null);
  const localVideoRef = useRef(null);
  const remoteVideoRef = useRef(null);
  const senderRef = useRef(null);

  const initPeer = useCallback((attemptIndex = 0) => {
    if (peerRef.current) {
      try { peerRef.current.destroy(); } catch(e) {}
      peerRef.current = null;
    }

    setStatus('connecting');
    setError('');
    
    const serverConfig = PEER_SERVERS[attemptIndex] || {};
    const serverName = serverConfig.host || 'PeerJS Cloud (по умолчанию)';
    setStatusText(`Подключение к серверу: ${serverName}...`);

    const shortId = generateShortId();
    
    const peerOptions = {
      config: { iceServers: ICE_SERVERS },
      debug: 1
    };

    // Добавляем кастомный сервер если указан
    if (serverConfig.host) {
      peerOptions.host = serverConfig.host;
      peerOptions.port = serverConfig.port;
      peerOptions.path = serverConfig.path;
      peerOptions.secure = serverConfig.secure;
    }

    let peer;
    try {
      peer = new Peer(shortId, peerOptions);
    } catch (err) {
      setError('Не удалось создать подключение: ' + err.message);
      setStatus('error');
      return;
    }

    let connected = false;
    const connectTimeout = setTimeout(() => {
      if (!connected) {
        console.warn('Таймаут подключения к серверу', serverName);
        if (attemptIndex < PEER_SERVERS.length - 1) {
          setServerAttempt(attemptIndex + 1);
          initPeer(attemptIndex + 1);
        } else {
          setError('Не удалось подключиться ни к одному серверу. Проверьте интернет-соединение.');
          setStatus('error');
          setStatusText('Ошибка подключения');
        }
      }
    }, 8000);

    peer.on('open', (id) => {
      connected = true;
      clearTimeout(connectTimeout);
      setMyId(id);
      setStatus('connected');
      setStatusText('🟢 Готов к звонкам');
      console.log('Peer подключен с ID:', id);
    });

    peer.on('call', async (call) => {
      try {
        setStatusText('Входящий звонок...');
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: 1280, height: 720 }, 
          audio: true 
        });
        localStreamRef.current = stream;
        cameraStreamRef.current = stream;
        if (localVideoRef.current) localVideoRef.current.srcObject = stream;

        call.answer(stream);
        currentCallRef.current = call;

        call.on('stream', (remoteStream) => {
          if (remoteVideoRef.current) {
            remoteVideoRef.current.srcObject = remoteStream;
            remoteVideoRef.current.play().catch(e => console.log('Автовоспр:', e));
          }
          setStatusText('🟢 Соединено');
          setInCall(true);
        });

        call.on('close', () => handleEndCall());
        call.on('error', (err) => {
          console.error('Ошибка звонка:', err);
          setError('Ошибка звонка: ' + err.message);
        });
      } catch (err) {
        console.error('Ошибка медиа:', err);
        setError('Нет доступа к камере/микрофону: ' + err.message);
        call.close();
      }
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err.type, err.message);
      clearTimeout(connectTimeout);
      
      // Критические ошибки - пробуем другой сервер
      if (!connected && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed')) {
        if (attemptIndex < PEER_SERVERS.length - 1) {
          console.log('Пробуем следующий сервер...');
          setServerAttempt(attemptIndex + 1);
          initPeer(attemptIndex + 1);
          return;
        }
      }
      
      // Ошибки во время звонка
      if (err.type === 'peer-unavailable') {
        setError('Собеседник не найден. Проверьте ID или попросите его обновить страницу.');
      } else if (err.type === 'unavailable-id') {
        // ID занят - перегенерируем
        initPeer(attemptIndex);
        return;
      } else if (err.type === 'disconnected') {
        setError('Соединение с сервером потеряно. Пытаюсь переподключиться...');
        setTimeout(() => {
          if (peerRef.current && !peerRef.current.destroyed) {
            peerRef.current.reconnect();
          }
        }, 2000);
      } else {
        setError('Ошибка: ' + (err.message || err.type));
      }
      
      if (!connected) {
        setStatus('error');
        setStatusText('Ошибка подключения');
      }
    });

    peer.on('disconnected', () => {
      console.log('Peer disconnected, trying to reconnect...');
      setStatusText('⚠️ Переподключение...');
      setTimeout(() => {
        if (peer && !peer.destroyed) {
          try { peer.reconnect(); } catch(e) {}
        }
      }, 1000);
    });

    peerRef.current = peer;
  }, []);

  useEffect(() => {
    initPeer(0);
    return () => {
      if (peerRef.current) {
        try { peerRef.current.destroy(); } catch(e) {}
      }
    };
  }, [initPeer]);

  const startCall = async () => {
    const targetId = remoteId.trim();
    if (!targetId) {
      setError('Введите ID собеседника');
      return;
    }
    if (targetId === myId) {
      setError('Нельзя звонить самому себе');
      return;
    }
    if (!peerRef.current || peerRef.current.destroyed) {
      setError('Нет подключения к серверу');
      return;
    }
    
    setError('');
    setStatusText('Соединение...');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { width: 1280, height: 720 }, 
        audio: true 
      });
      localStreamRef.current = stream;
      cameraStreamRef.current = stream;
      if (localVideoRef.current) localVideoRef.current.srcObject = stream;

      const call = peerRef.current.call(targetId, stream);
      if (!call) {
        throw new Error('Не удалось инициировать звонок');
      }
      currentCallRef.current = call;

      let streamReceived = false;
      const streamTimeout = setTimeout(() => {
        if (!streamReceived) {
          setError('Собеседник не отвечает. Убедитесь, что он онлайн.');
          handleEndCall();
        }
      }, 15000);

      call.on('stream', (remoteStream) => {
        streamReceived = true;
        clearTimeout(streamTimeout);
        if (remoteVideoRef.current) {
          remoteVideoRef.current.srcObject = remoteStream;
          remoteVideoRef.current.play().catch(e => console.log(e));
        }
        setStatusText('🟢 Соединено');
        setInCall(true);
      });

      call.on('close', () => {
        clearTimeout(streamTimeout);
        handleEndCall();
      });
      call.on('error', (err) => {
        clearTimeout(streamTimeout);
        setError('Ошибка звонка: ' + err.message);
        handleEndCall();
      });
    } catch (err) {
      console.error(err);
      setError('Нет доступа к камере/микрофону: ' + err.message);
      setStatusText('🟢 Готов к звонкам');
    }
  };

  const toggleMic = () => {
    if (localStreamRef.current) {
      const track = localStreamRef.current.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        setMicOn(track.enabled);
      }
    }
  };

  const toggleCam = () => {
    if (localStreamRef.current) {
      const track = localStreamRef.current.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        setCamOn(track.enabled);
      }
    }
  };

  const toggleScreenShare = async () => {
    if (!currentCallRef.current) return;

    if (!screenSharing) {
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ 
          video: true, 
          audio: true 
        });
        const screenTrack = screenStream.getVideoTracks()[0];

        const pc = currentCallRef.current.peerConnection;
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        
        if (sender) {
          await sender.replaceTrack(screenTrack);
          senderRef.current = sender;
        }

        if (localVideoRef.current) localVideoRef.current.srcObject = screenStream;
        setScreenSharing(true);
        screenTrack.onended = () => stopScreenShare();
      } catch (err) {
        if (err.name !== 'NotAllowedError') {
          setError('Не удалось начать демонстрацию: ' + err.message);
        }
      }
    } else {
      stopScreenShare();
    }
  };

  const stopScreenShare = async () => {
    if (senderRef.current && cameraStreamRef.current) {
      const videoTrack = cameraStreamRef.current.getVideoTracks()[0];
      if (videoTrack) await senderRef.current.replaceTrack(videoTrack);
      if (localVideoRef.current) localVideoRef.current.srcObject = cameraStreamRef.current;
    }
    setScreenSharing(false);
  };

  const handleEndCall = () => {
    if (currentCallRef.current) {
      try { currentCallRef.current.close(); } catch(e) {}
      currentCallRef.current = null;
    }
    if (localStreamRef.current) {
      localStreamRef.current.getTracks().forEach(t => t.stop());
      localStreamRef.current = null;
    }
    if (cameraStreamRef.current && cameraStreamRef.current !== localStreamRef.current) {
      cameraStreamRef.current.getTracks().forEach(t => t.stop());
    }
    cameraStreamRef.current = null;
    if (localVideoRef.current) localVideoRef.current.srcObject = null;
    if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
    setInCall(false);
    setScreenSharing(false);
    setMicOn(true);
    setCamOn(true);
    setStatusText('🟢 Готов к звонкам');
    setRemoteId('');
  };

  const copyId = () => {
    if (!myId) return;
    navigator.clipboard.writeText(myId).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {
      // Fallback для старых браузеров
      const ta = document.createElement('textarea');
      ta.value = myId;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch(e) {}
      document.body.removeChild(ta);
    });
  };

  const retryConnection = () => {
    setServerAttempt(0);
    initPeer(0);
  };

  return (
    <div className="app">
      <div className="header">
        <h1>📹 SEDA2026</h1>
        <p>Видеозвонки • Голосовая связь • Демонстрация экрана</p>
      </div>

      {error && <div className="error">⚠️ {error}</div>}

      {!inCall ? (
        <div className="lobby">
          <div className={`status ${status}`}>
            {status === 'connecting' && <span className="spinner"></span>}
            {statusText}
          </div>

          {status === 'error' && (
            <button className="retry-btn" onClick={retryConnection}>
              🔄 Повторить подключение
            </button>
          )}

          {myId && (
            <div>
              <p style={{marginBottom: '5px', marginTop: '15px'}}>Ваш ID (передайте собеседнику):</p>
              <div className="my-id">
                <strong>{myId}</strong>
                <button className="copy-btn" onClick={copyId}>
                  {copied ? '✓ Скопировано' : '📋 Копировать'}
                </button>
              </div>
            </div>
          )}

          <p style={{marginTop: '20px', marginBottom: '5px'}}>ID собеседника:</p>
          <input
            type="text"
            placeholder="Например: seda-abc123"
            value={remoteId}
            onChange={(e) => setRemoteId(e.target.value)}
            onKeyPress={(e) => e.key === 'Enter' && startCall()}
          />
          <button onClick={startCall} disabled={!myId || status !== 'connected'}>
            📞 Позвонить
          </button>

          <div className="info">
            <strong>Как пользоваться:</strong><br/>
            1. Скопируйте свой ID и отправьте его собеседнику<br/>
            2. Либо вставьте ID собеседника и нажмите "Позвонить"<br/>
            3. Разрешите доступ к камере и микрофону<br/>
            4. Во время звонка можно включить демонстрацию экрана 🖥️
                      </div>

          {serverAttempt > 0 && (
            <div className="server-info">
              Попытка подключения к серверу: {serverAttempt + 1}
            </div>
          )}

          <div className="server-info">
            💡 Если не работает - проверьте интернет или попробуйте открыть через HTTPS
          </div>
        </div>
      ) : (
        <div>
          <div className="status connected">{statusText}</div>
          
          <div className="videos">
            <div className="video-container">
              <video ref={localVideoRef} autoPlay playsInline muted />
              <div className="video-label">
                Вы {screenSharing && '🖥️ (экран)'} {!micOn && '🔇'} {!camOn && '📷❌'}
              </div>
            </div>
            <div className="video-container">
              <video ref={remoteVideoRef} autoPlay playsInline />
              <div className="video-label">Собеседник</div>
            </div>
          </div>

          <div className="controls">
            <button 
              className={`control-btn ${!micOn ? 'off' : ''}`} 
              onClick={toggleMic} 
              title={micOn ? 'Выключить микрофон' : 'Включить микрофон'}
            >
              {micOn ? '🎤' : '🔇'}
            </button>
            <button 
              className={`control-btn ${!camOn ? 'off' : ''}`} 
              onClick={toggleCam}
              title={camOn ? 'Выключить камеру' : 'Включить камеру'}
            >
              {camOn ? '📹' : '📷'}
            </button>
            <button 
              className={`control-btn screen ${screenSharing ? 'active' : ''}`} 
              onClick={toggleScreenShare}
              title={screenSharing ? 'Остановить демонстрацию' : 'Демонстрация экрана'}
            >
              🖥️
            </button>
            <button 
              className="control-btn end" 
              onClick={handleEndCall}
              title="Завершить звонок"
            >
              📵
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
